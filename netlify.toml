[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Send the default Netlify address to the real domain, so search engines only list griffinh.me.
[[redirects]]
  from = "https://griffinh.netlify.app/*"
  to = "https://griffinh.me/:splat"
  status = 301
  force = true

# Fingerprinted build assets never change, so browsers can keep them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
